name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/i386-elf
            ~/.cache/nasm
          key: ${{ runner.os }}-toolchain-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-toolchain-

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Basic tools
          sudo apt-get install -y nasm qemu-system-i386
          # 32-bit cross compiler packages
          sudo apt-get install -y gcc-i686-linux-gnu binutils-i686-linux-gnu
          # Provide the names expected by the Makefile
          sudo ln -sf /usr/bin/i686-linux-gnu-gcc /usr/bin/i386-elf-gcc
          sudo ln -sf /usr/bin/i686-linux-gnu-ld /usr/bin/i386-elf-ld
          sudo ln -sf /usr/bin/i686-linux-gnu-objcopy /usr/bin/i386-elf-objcopy

      - name: Build
        run: |
          mkdir -p build
          make clean
          make

      - name: Run tests
        run: |
          qemu-system-i386 -nographic -m 64 -drive format=raw,file=build/os.img -serial stdio -monitor none -display none &
          QEMU_PID=$!
          sleep 5
          # Verify kernel booted cleanly and QEMU is still running stably without crashing
          if kill -0 $QEMU_PID 2>/dev/null; then
            echo "Kernel booted successfully and ran stably for 5 seconds."
            kill -9 $QEMU_PID 2>/dev/null || true
          else
            echo "QEMU crashed or exited unexpectedly – test failed"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-image
          path: build/os.img

  clean-cache:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clean build directory
        run: |
          rm -rf build/*