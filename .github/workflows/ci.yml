name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/i386-elf
            ~/.cache/nasm
          key: ${{ runner.os }}-toolchain-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-toolchain-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm i386-elf-gcc i386-elf-ld qemu-system-i386

      - name: Build
        run: |
          make clean
          make

      - name: Run tests
        run: |
          qemu-system-i386 -nographic -m 64 -drive format=raw,file=build/os.img -serial stdio -monitor none -no-reboot -no-shutdown -display none -S -s &
          sleep 5
          # If the kernel exits with 0, the test passes
          if ! kill -0 $!; then
            echo "QEMU exited successfully"
          else
            echo "QEMU still running – test failed"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: os-image
          path: build/os.img

  clean-cache:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Clean build directory
        run: |
          rm -rf build/*